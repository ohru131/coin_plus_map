name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # GitHub ActionsのcronはUTC。毎月1日00:15 UTC = 09:15 JST。
    - cron: "15 0 1 * *"
  workflow_dispatch:
    inputs:
      refresh_store_data:
        description: Refresh the COIN+ store dataset from the official source before deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python for offline geocoding
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_store_data
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install offline geocoder
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_store_data
        run: python -m pip install --disable-pip-version-check 'jageocoder==2.2.1.1'

      - name: Restore street-block address dictionary
        id: jageocoder-dictionary
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_store_data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jageocoder/db2
          key: jageocoder-gaiku-v22-20250423

      - name: Install street-block address dictionary
        if: (github.event_name != 'workflow_dispatch' || inputs.refresh_store_data) && steps.jageocoder-dictionary.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --show-error --location \
            'https://www.info-proto.com/static/jageocoder/latest/v2/gaiku_all_20250423_v22.zip' \
            --output "${RUNNER_TEMP}/gaiku_all_v22.zip"
          JAGEOCODER_DB2_DIR="${RUNNER_TEMP}/jageocoder/db2" \
            jageocoder install-dictionary "${RUNNER_TEMP}/gaiku_all_v22.zip"

      - name: Prepare versioned store dataset
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_store_data
        run: |
          set -euo pipefail
          snapshot="$(date -u +%F)"
          curl --fail --show-error --location \
            "https://coinplus.jp/assets/csv/storesearch/all_shop_list.js" \
            --output /tmp/all_shop_list.csv
          python3 scripts/build_store_dataset.py \
            --source /tmp/all_shop_list.csv \
            --output /tmp/stores-raw.json \
            --source-snapshot "$snapshot"
          python3 scripts/geocode_store_dataset.py \
            --stores /tmp/stores-raw.json \
            --output /tmp/store-coordinates.json \
            --db-dir "${RUNNER_TEMP}/jageocoder/db2"
          python3 scripts/build_store_dataset.py \
            --source /tmp/all_shop_list.csv \
            --output /tmp/stores.json \
            --coordinates /tmp/store-coordinates.json \
            --source-snapshot "$snapshot"
          digest="$(sha256sum /tmp/stores.json | cut -c1-12)"
          filename="coinplus-stores-${snapshot}_${digest}.json"
          mkdir -p client/public/data
          mv /tmp/stores.json "client/public/data/${filename}"
          cat > client/public/store-data-manifest.json <<EOF
          {
            "schemaVersion": 1,
            "version": "${snapshot}-${digest}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "datasetPath": "data/${filename}",
            "sourceSnapshot": "${snapshot}"
          }
          EOF

      - name: Build static site
        env:
          VITE_DEPLOY_TARGET: github-pages
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
