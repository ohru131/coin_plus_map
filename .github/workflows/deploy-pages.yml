name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_store_data:
        description: Refresh the COIN+ store dataset from the official source before deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare versioned store dataset
        if: github.event_name == 'push' || inputs.refresh_store_data
        run: |
          set -euo pipefail
          snapshot="$(date -u +%F)"
          curl --fail --show-error --location \
            "https://coinplus.jp/assets/csv/storesearch/all_shop_list.js" \
            --output /tmp/all_shop_list.csv
          python3 scripts/build_store_dataset.py \
            --source /tmp/all_shop_list.csv \
            --output /tmp/stores.json \
            --source-snapshot "$snapshot"
          digest="$(sha256sum /tmp/stores.json | cut -c1-12)"
          filename="coinplus-stores-${snapshot}_${digest}.json"
          mkdir -p client/public/data
          mv /tmp/stores.json "client/public/data/${filename}"
          cat > client/public/store-data-manifest.json <<EOF
          {
            "schemaVersion": 1,
            "version": "${snapshot}-${digest}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "datasetPath": "data/${filename}",
            "sourceSnapshot": "${snapshot}"
          }
          EOF

      - name: Build static site
        env:
          VITE_DEPLOY_TARGET: github-pages
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
